# Claude Code on GitHub — Issue / PR コメントで @claude と書くと起動します。
#
# 初回セットアップ（リポジトリ管理者が実施）:
#   1. https://github.com/apps/claude をこのリポジトリにインストール
#   2. Settings → Secrets and variables → Actions で次のいずれかを追加
#        - ANTHROPIC_API_KEY（Anthropic コンソールの API キー）
#        または
#        - CLAUDE_CODE_OAUTH_TOKEN（ローカルで `claude setup-token` で取得、Pro/Max 向け）
#   3. ローカルで Claude Code を使う場合は `/install-github-app` で案内に従う方法も可
#
# 公式: https://docs.claude.com/en/docs/claude-code/github-actions

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
